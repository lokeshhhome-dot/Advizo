  <!-- shopify-api-key meta + app-bridge.js load ONLY when this document was
       opened with Shopify's embedded-app `host` param (i.e. genuinely
       inside Shopify Admin). This same index.html is served for every
       route, including the standalone consultant portal (/login,
       /consultant-dashboard), which must never trigger Shopify's App
       Bridge CDN script — it auto-redirects any top-level, non-embedded
       page to admin.shopify.com the moment it finds the meta tag, with no
       dependency on `host` itself. Written synchronously via
       document.write, during initial HTML parsing — same timing as a
       static tag would have — because Shopify Admin's parent frame
       negotiates TopBar/navigation UI by reading this meta tag very early;
       injecting it later (e.g. from a React effect, after mount) misses
       that window and Admin falls back to degraded plain-link navigation.
       Do not move this into React. -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.has("host")) {
        document.write('<meta name="shopify-api-key" content="%REACT_APP_SHOPIFY_API_KEY%">');
        document.write('<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"><\/script>');
      }
    })();
  </script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>

  <title>Consultly</title>
  <!-- CSS - Build se exact path -->
  <link href="/static/css/main.cf6e1172.css" rel="stylesheet">
</head>

<body>
  <!-- <noscript>You need to enable JavaScript to run this app.</noscript> -->
  <!-- Shopify App Bridge script - MUST load before React app -->

  <!-- Advizo boot loader — Consultant/Admin DASHBOARD ONLY, never the
       storefront. This index.html is shared by every route this app serves
       (storefront-embedded chat/profile/cards, the admin dashboard, and the
       consultant dashboard), so this whole block is gated synchronously on
       location.pathname before writing anything to the document. On any
       non-dashboard path this script does nothing but define a no-op
       window.__advizoReady (safe for the dashboard bundle to call
       unconditionally) and exits immediately — no style, no markup, zero
       visual/behavioral effect on the storefront. Written with
       document.write (same technique already used above for the
       shopify-api-key tag) so the loader paints as part of the very first
       HTML stream, before the React bundle downloads/parses/executes. -->
  <script>
    (function () {
      var isDashboard = window.location.pathname.indexOf("/consultant-dashboard") === 0;
      if (!isDashboard) {
        window.__advizoReady = function () {};
        return;
      }

      var startedAt = Date.now();
      var MIN_VISIBLE_MS = 900;
      var EXIT_MS = 240;
      var REDUCED_EXIT_MS = 160;
      var SAFETY_TIMEOUT_MS = 8000; // circuit-breaker only, never the primary signal
      var exited = false;

      document.write(
        '<style id="advizo-style">' +
        '#advizo-loader{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;overflow:hidden;' +
        'background:radial-gradient(120% 90% at 50% 42%,#fbf8f2 0%,#f4efe6 58%,#ece5d8 100%);transition:opacity ' + EXIT_MS + 'ms cubic-bezier(.4,0,.2,1);}' +
        '#advizo-loader::before{content:"";position:absolute;inset:0;pointer-events:none;' +
        'background-image:linear-gradient(rgba(20,33,61,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(20,33,61,.055) 1px,transparent 1px);' +
        'background-size:56px 56px;opacity:.85;}' +
        '#advizo-loader.advizo-exit{opacity:0;}' +
        '.advizo-lockup{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateY(-8%);padding:0 24px;box-sizing:border-box;max-width:100%;}' +
        '.advizo-halo{position:absolute;top:-30px;left:50%;width:120px;height:120px;margin-left:-60px;border-radius:50%;pointer-events:none;' +
        'background:radial-gradient(circle,rgba(200,135,31,.20),transparent 70%);animation:advizoHalo 1.5s ease-in-out infinite;}' +
        '.advizo-mark{width:64px;height:56px;overflow:visible;}' +
        '.advizo-hair{fill:none;stroke:#14213d;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:34;stroke-dashoffset:34;' +
        'animation:advizoDraw .7s cubic-bezier(.65,0,.35,1) forwards;}' +
        '.advizo-hair-2{animation-delay:.15s;}' +
        '.advizo-cross{fill:none;stroke:#c8871f;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:14;stroke-dashoffset:14;' +
        'animation:advizoDraw .5s cubic-bezier(.65,0,.35,1) forwards;animation-delay:.72s;}' +
        '.advizo-spark{fill:#c8871f;opacity:0;transform-box:fill-box;transform-origin:center;animation:advizoSpark .9s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:.82s;}' +
        '.advizo-word{font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;font-display:swap;font-weight:600;font-size:22px;' +
        'letter-spacing:.14em;color:#14213d;opacity:0;transform:translateY(6px);animation:advizoFadeUp 1.5s cubic-bezier(.16,1,.3,1) forwards;animation-delay:.2s;}' +
        '.advizo-caption{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;font-display:swap;font-weight:500;font-size:10px;' +
        'letter-spacing:.12em;color:#6b6255;text-align:center;opacity:0;animation:advizoFadeUp 1.7s cubic-bezier(.16,1,.3,1) forwards;}' +
        '@keyframes advizoHalo{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}' +
        '@keyframes advizoDraw{to{stroke-dashoffset:0;}}' +
        '@keyframes advizoSpark{0%{opacity:0;transform:scale(0);}60%{opacity:1;transform:scale(1.3);}100%{opacity:1;transform:scale(1);}}' +
        '@keyframes advizoFadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}' +
        '#root{opacity:0;transform:scale(1.02);transition:opacity ' + EXIT_MS + 'ms cubic-bezier(.4,0,.2,1),transform ' + EXIT_MS + 'ms cubic-bezier(.4,0,.2,1);}' +
        '#root.advizo-root-enter{opacity:1;transform:scale(1);}' +
        '@media (max-width:640px){#advizo-loader::before{background-size:44px 44px;}' +
        '.advizo-lockup{transform:translateY(-14%);gap:10px;}.advizo-caption{max-width:230px;}}' +
        '@supports (padding:max(0px)){.advizo-lockup{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));}}' +
        '@media (prefers-reduced-motion:reduce){' +
        '.advizo-halo,.advizo-hair,.advizo-cross,.advizo-spark,.advizo-word,.advizo-caption{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important;}' +
        '#advizo-loader{transition:opacity ' + REDUCED_EXIT_MS + 'ms linear;}' +
        '#root{transition:opacity ' + REDUCED_EXIT_MS + 'ms linear;transform:none;}}' +
        '</style>'
      );

      document.write(
        '<div id="advizo-loader" role="status" aria-live="polite" aria-label="Loading Advizo">' +
        '<div class="advizo-lockup">' +
        '<div class="advizo-halo" aria-hidden="true"></div>' +
        '<svg class="advizo-mark" viewBox="0 0 32 28" aria-hidden="true">' +
        '<path class="advizo-hair advizo-hair-1" d="M3 25 L14.4 3"/>' +
        '<path class="advizo-hair advizo-hair-2" d="M29 25 L17.6 3"/>' +
        '<path class="advizo-cross" d="M9.4 16.5 L22.6 16.5"/>' +
        '<circle class="advizo-spark" cx="16" cy="1.6" r="1.9"/>' +
        '</svg>' +
        '<div class="advizo-word" aria-hidden="true">ADVIZO</div>' +
        '<div class="advizo-caption" aria-hidden="true">CONNECTING YOU TO THE RIGHT EXPERTISE</div>' +
        '</div>' +
        '</div>'
      );

      function cleanup() {
        var loader = document.getElementById("advizo-loader");
        if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        var style = document.getElementById("advizo-style");
        if (style && style.parentNode) style.parentNode.removeChild(style);
        var root = document.getElementById("root");
        if (root) root.classList.remove("advizo-root-enter");
      }

      function runExit() {
        var loader = document.getElementById("advizo-loader");
        var root = document.getElementById("root");
        var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (!loader) {
          cleanup();
          return;
        }

        if (reduced) {
          loader.classList.add("advizo-exit");
          if (root) root.classList.add("advizo-root-enter");
          setTimeout(cleanup, REDUCED_EXIT_MS + 20);
          return;
        }

        loader.classList.add("advizo-exit");
        if (root) root.classList.add("advizo-root-enter");
        setTimeout(cleanup, EXIT_MS + 20);
      }

      window.__advizoReady = function () {
        if (exited) return;
        exited = true;
        var elapsed = Date.now() - startedAt;
        var wait = Math.max(0, MIN_VISIBLE_MS - elapsed);
        setTimeout(runExit, wait);
      };

      // Safety net only — real readiness always comes from
      // window.__advizoReady() being called by the dashboard once it has
      // actually rendered. This just prevents a genuinely stuck boot from
      // leaving a full-screen overlay up forever.
      setTimeout(function () {
        if (!exited) window.__advizoReady();
      }, SAFETY_TIMEOUT_MS);
    })();
  </script>

  <div id="root"></div>
