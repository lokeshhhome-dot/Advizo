# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a9add55fcfab5c5c3c749ca6e958264a"
application_url = "https://advizo-api.fossilapps.com"
embedded = true
name = "Advizo"
handle = "advizo"

[app_proxy]
url = "https://advizo-api.fossilapps.com/api/app/advizo"
subpath = "advizo"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "https://advizo-api.fossilapps.com/api/webhooks/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://advizo-api.fossilapps.com/api/webhooks/shop/orders-created"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "https://advizo-api.fossilapps.com/api/webhooks/theme/webhooks"
  topics = [ "themes/update", "themes/publish" ]

  [[webhooks.subscriptions]]
  uri = "https://advizo-api.fossilapps.com/api/webhooks/app-uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,write_draft_orders,read_online_store_navigation,write_online_store_navigation,read_online_store_pages,write_online_store_pages,read_orders,write_orders,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://advizo-api.fossilapps.com/api/app/callback" ]
