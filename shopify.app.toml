[webhooks]
api_version = "2026-07"

# -------------------------------
# Orders / Refunds — TEMPORARILY REMOVED
# -------------------------------
# orders/create, orders/paid, orders/delete, orders/cancelled, refunds/create
# all require Shopify's "Protected Customer Data" approval before a real app
# version can be created (`shopify app deploy` hard-fails otherwise — `shopify
# app dev` does not enforce this, which is why it worked without them).
# Their handlers still exist in consultly_Backend/Controller/webHookController.js
# and consultly_Backend/Routes/webHookRoute.js — nothing there was touched.
# Restore this block once Protected Customer Data access is approved in the
# Partner Dashboard: https://shopify.dev/docs/apps/launch/protected-customer-data
#
# [[webhooks.subscriptions]]
# topics = ["orders/create"]
# uri = "/api/webhooks/shop/orders-created"
#
# [[webhooks.subscriptions]]
# topics = ["orders/paid"]
# uri = "/api/webhooks/shop/orders-paid"
#
# [[webhooks.subscriptions]]
# topics = ["orders/delete"]
# uri = "/api/webhooks/shop/orders-deleted"
#
# [[webhooks.subscriptions]]
# topics = ["orders/cancelled"]
# uri = "/api/webhooks/shop/orders-cancelled"
#
# [[webhooks.subscriptions]]
# topics = ["refunds/create"]
# uri = "/api/webhooks/shop/refunds-created"

# -------------------------------
# Themes
# -------------------------------

[[webhooks.subscriptions]]
topics = [
  "themes/publish",
  "themes/update"
]
uri = "/api/webhooks/theme/webhooks"

# -------------------------------
# App lifecycle
# -------------------------------

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/webhooks/app-uninstalled"

# -------------------------------
# GDPR Compliance
# -------------------------------

[[webhooks.subscriptions]]
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]
uri = "/api/webhooks/webhooks"

[access_scopes]
scopes ="read_customers,write_customers,write_draft_orders,read_online_store_navigation,write_online_store_navigation,read_online_store_pages,write_online_store_pages,read_orders,write_orders,read_themes"
optional_scopes = []

use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://consultly-backend.onrender.com/api/app/callback"
]

[app_proxy]
url = "https://consultly-backend.onrender.com/api/app/consultly"
subpath = "consultly"
prefix = "apps"