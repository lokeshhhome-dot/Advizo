client_id = "1216ebdd9f32511b5357c889ecf00478"
name = "talk2consultant"
application_url = "https://untaxed-cattishly-renewal.ngrok-free.dev"
embedded = true
handle = "talk2consultant"

[webhooks]
api_version = "2026-07"

# -------------------------------
# Orders / Refunds
# -------------------------------
# orders/create, orders/delete, orders/cancelled, refunds/create were removed
# pending Shopify's "Protected Customer Data" approval (`shopify app deploy`
# hard-fails without it). That approval has since been granted, so the ONE
# topic the wallet-recharge flow actually needs — orders/paid, the only
# event that proves payment was captured, not just that an order exists — is
# restored below. uri points at the existing, already-implemented handler
# (paymentSucessController in webHookController.js, mounted in
# webHookRoute.js) — an absolute URL, matching the app/uninstalled and GDPR
# subscriptions below, since application_url above is a dev tunnel, not the
# production backend.
#
# The other four topics (orders/create, orders/delete, orders/cancelled,
# refunds/create) are left commented out — nothing in the wallet-credit flow
# needs them; restore them separately if/when something does.
[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "https://consultly-backend.onrender.com/api/webhooks/shop/webhooks"

# [[webhooks.subscriptions]]
# topics = ["orders/create"]
# uri = "/api/webhooks/shop/orders-created"
#
# [[webhooks.subscriptions]]
# topics = ["orders/delete"]
# uri = "/api/webhooks/shop/orders-deleted"
#
# [[webhooks.subscriptions]]
# topics = ["orders/cancelled"]
# uri = "/api/webhooks/shop/orders-cancelled"
#
# [[webhooks.subscriptions]]
# topics = ["refunds/create"]
# uri = "/api/webhooks/shop/refunds-created"

# -------------------------------
# Themes
# -------------------------------

[[webhooks.subscriptions]]
topics = [
  "themes/publish",
  "themes/update"
]
uri = "/api/webhooks/theme/webhooks"

# -------------------------------
# App lifecycle
# -------------------------------

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://consultly-backend.onrender.com/api/webhooks/app-uninstalled"

# -------------------------------
# GDPR Compliance
# -------------------------------

[[webhooks.subscriptions]]
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]
uri = "https://consultly-backend.onrender.com/api/webhooks/webhooks"

[access_scopes]
scopes ="read_customers,write_customers,write_draft_orders,read_online_store_navigation,write_online_store_navigation,read_online_store_pages,write_online_store_pages,read_orders,write_orders,read_themes"
optional_scopes = []

use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://consultly-backend.onrender.com/api/app/callback"
]

[app_proxy]
url = "https://consultly-backend.onrender.com/api/app/consultly"
subpath = "consultly"
prefix = "apps"